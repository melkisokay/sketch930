<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>sketch 3</title>
    <style>
      #apple {
        border-radius: 50% ;
        height: 200px;
        width: 200px;
        position: absolute;
        background-image: url("apple.jpeg");
        /*makes the image fit into the shape*/
        background-position: center;
        background-size: cover;
        box-shadow: 12px 10px;
        color: #b6bb95
          
      }
      body {
      background-image: url("apple.jpg")     }
    </style>
  </head>
  <body>
    <div id="apple">
    </div>
    <script>
      let nameObj = "apple" ///string global var
      let speed = 1; ////number global var
      let moving = true; //boolean global var

      let x = 100;
      let y = 100;
      let dx = speed;
      let dy = speed;

      function moveApple () {
        if (moving) {
          x += dx;
          y += dy;

          if (x > window.innerWidth - 50 || x < 0) {
            dx = -dx;
          }

          if (y > window.innerHeight - 50 || y < 0) {
            dy = -dy;
          }

          apple.style.left = x + "px"
          apple.style.top = y + "px"
        }

      }

      function showInfo () {
        console.log(nameObj, speed, moving);
      }
      showInfo();
      setInterval(moveApple, 20);
    </script>
  </body>
</html>
